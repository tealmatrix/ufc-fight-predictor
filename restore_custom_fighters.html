        function restoreFighters() {
            try {
                localStorage.setItem('customFighters', JSON.stringify(backupData));
                showStatus('✅ Success! Restored 53 custom fighters to localStorage.', 'success');
            } catch (error) {
                showStatus('❌ Error: ' + error.message, 'warning');
            }
        }

        function checkCurrentStorage() {
            const current = localStorage.getItem('customFighters');
            if (!current) {
                showStatus('ℹ️ No custom fighters currently in localStorage.', 'info');
                return;
            }
            
            try {
                const fighters = JSON.parse(current);
                const fighterList = fighters.slice(0, 10).map(f => f.name).join(', ');
                const more = fighters.length > 10 ? ` and ${fighters.length - 10} more...` : '';
                showStatus(
                    `ℹ️ Current storage contains ${fighters.length} fighters:<br><br>${fighterList}${more}`,
                    'info'
                );
            } catch (error) {
                showStatus('⚠️ Current data appears corrupted: ' + error.message, 'warning');
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = message;
            statusDiv.className = 'status ' + type;
            statusDiv.style.display = 'block';
        }
